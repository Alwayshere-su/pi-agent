# ═══════════════════════════════════════════════════════════════
# CI — Continuous Integration for Pi-Agent
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── 1. Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── 3. Install dependencies ──
      # CI 优先使用 requirements-test.txt（精简版，仅含测试导入链实际需要的包）：
      #   numpy + scipy + requests + markitdown + markdownify（< 50 MB）
      # chromadb / sentence-transformers / FlagEmbedding（~3 GB）是拟实施阶段
      # 的混合检索依赖，核心模块和测试完全不 import 它们。
      # 若 requirements-test.txt 不存在则回退到完整 requirements.txt。
      # pytest 作为 CI 专用工具单独安装，不写入依赖文件。
      # --no-cache-dir 避免缓存占用 GitHub Actions 已受限的磁盘空间。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            pip install --no-cache-dir -r requirements-test.txt
            echo "✓ 已安装精简测试依赖（requirements-test.txt）"
          else
            pip install --no-cache-dir -r requirements.txt
            echo "⚠ 回退: 使用完整 requirements.txt（含 ~3GB ML 模型依赖）"
          fi
          pip install --no-cache-dir pytest

      # ── 4. Import check ──
      - name: Verify core modules importable
        run: |
          python -c "from literature_agent.search import LiteratureSearcher; from literature_agent.discovery import BayesianOptimizer; print('OK')"

      # ── 5. Run tests（质量闸门）──
      # 设计意图：pytest 失败即 CI 失败（不设 continue-on-error），
      # 作为真正的质量闸门拦截回归。
      # 所有测试已集中到 tests/（67ca04f reorganize repo structure），
      # 共 127 项（2026-08-16 实测 python -m pytest tests/ --collect-only -q），
      # 覆盖 config、discovery、extractor、search、parser_engine、
      # core functions（test_core）、budget resume、search isolation（test_search_isolation）。
      # test_core.py / test_search_isolation.py 通过文件底部 pytest 可见封装被收集；
      # scipy 不可用时这两文件会优雅 SKIP 相关分组（CI 正常安装后全量运行）。
      - name: Run tests
        run: |
          python -m pytest tests/ -v

      # ── 6. Lint with ruff（软检查）──
      # 设计意图：lint 仅作风格提示（continue-on-error: true），不拦截提交；
      # 与 test 步骤（硬闸门）职责分离——代码风格问题不应阻塞功能性修复合入。
      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --select=E,F --ignore=E501
