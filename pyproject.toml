[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent"
version = "0.2.0"
description = "材料科学文献驱动的构效关系自主发现智能体"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.108",
    "requests>=2.32",
    "charset-normalizer>=3.4",
    "magika>=1.0",
    "markitdown>=0.1",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2",
    "mammoth>=1.12",
    "pdfplumber>=0.11",
    "pdfminer.six>=2026",
    "numpy>=1.26",
    "scipy>=1.17",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "datasets>=4.8",
    "python-docx>=1.2",
]

[project.scripts]
pi-agent = "main:main"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
